name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"   # run once daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 1. Wakatime Stats
      - name: Generate Wakatime Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=techzealot&layout=compact&langs_count=20
          path: dist/wakatime-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Profile Trophy
      - name: Generate Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: techzealot
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Activity Graph
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: techzealot
          options: theme=merko
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push all assets to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
